 app.innerHTML=hud(t('lives')+' '+G.lives)+bar()+`<div class="card"><div class="es">${esc(W[i].fr)}</div><div class="tip">${t('spell')}</div></div><div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><button class="ghost" onclick="u1()">${t('clear')}</button>`+pzb();
 r1();clock(keep?G.rem:Math.max(8000,(20000-G.n*500)*G.dd),()=>e1(false))}
function r1(){const used=G.ans.map(x=>x.k);
 document.getElementById('slots').innerHTML=[...G.t].map((_,j)=>`<span class="slot">${G.ans[j]?esc(G.ans[j].ch):''}</span>`).join('');
 document.getElementById('tiles').innerHTML=G.tiles.map(x=>`<button class="tile b${x.k%4}" ${used.includes(x.k)?'disabled':''} onclick="t1(${x.k})">${esc(x.ch)}</button>`).join('')}
function t1(k){if(G.lock)return;G.ans.push(G.tiles.find(x=>x.k===k));r1();if(G.ans.length===G.t.length)e1(G.ans.map(x=>x.ch).join('')===G.t)}
function u1(){if(!G.lock){G.ans.pop();r1()}}
function e1(ok){if(G.lock)return;G.lock=true;clearInterval(tm);G.n++;
 if(ok){win(G.cur);add(G.t.length*4+spd())}
 else{miss(G.cur);G.lives--;document.getElementById('slots').innerHTML=[...G.t].map(c=>`<span class="slot" style="color:var(--a)">${esc(c)}</span>`).join('')}
 push();nxt(f1,ok?500:1800)}
/* 3. El ou la ? */
function t2(){const n=Date.now();G.bank-=(n-G.t0)*(1+G.n*.02)/G.dd;G.t0=n;
 const b=document.getElementById('bar'),h=document.getElementById('h');
 if(b)b.style.width=Math.max(0,Math.min(100,G.bank/G.max*100))+'%';if(h)h.innerHTML=hud(Math.max(0,Math.ceil(G.bank/1000))+' s');if(G.bank<=0)fin()}
function f2(keep){G.fn=2;if(!keep){G.bank=30000;G.max=45000}G.t0=Date.now();
 app.innerHTML=`<div id="h"></div>${bar()}<div class="card" id="cd"><div class="es" id="w"></div><div class="tip">${t('ella')}</div></div><div class="grid"><button class="b1" onclick="a2('el')">EL</button><button class="b0" onclick="a2('la')">LA</button></div>`+pzb();
 if(keep)document.getElementById('w').textContent=W[G.cur].w;else n2();clearInterval(tm);tm=setInterval(t2,100)}
function n2(){G.cur=pick();document.getElementById('w').textContent=W[G.cur].w}
function a2(g){const ok=W[G.cur].g===g,c=document.getElementById('cd');G.n++;
 if(ok){win(G.cur);add(10);G.bank=Math.min(G.max,G.bank+1200)}else{miss(G.cur);G.bank-=4000}
 c.className='card';void c.offsetWidth;c.className='card '+(ok?'pop':'shake');n2();push()}
/* 4. Paires */
function f3(keep){G.fn=3;if(!keep){G.bank=50000;G.max=70000;G.nc=0}G.t0=Date.now();
 app.innerHTML=`<div id="h"></div>${bar()}<div class="pg" id="pg"></div>`+pzb();if(keep)r3();else r3n();clearInterval(tm);tm=setInterval(t2,100)}
function r3n(){const s=new Set(),k=Math.min(6,G.pool.length);while(s.size<k)s.add(pick());G.tl=sh([...s].flatMap(i=>[{i,l:'es'},{i,l:'fr'}]));G.done={};G.sel=null;G.bad=null;G.k=k;r3()}
function r3(){const e=document.getElementById('pg');if(!e)return;e.innerHTML=G.tl.map((x,j)=>{const d=G.done[x.i];
 return `<button class="pt${d!=null?' d p'+d:''}${G.sel===j?' sel':''}${G.bad&&G.bad.includes(j)?' wrong':''}" ${d!=null?'disabled':''} onclick="p3(${j})">${esc(x.l==='es'?W[x.i].es:W[x.i].fr)}</button>`}).join('')}
function p3(j){if(G.bad)return;
 if(G.sel==null||G.sel===j){G.sel=G.sel===j?null:j}
 else{const A=G.tl[G.sel],B=G.tl[j];
  if(A.l===B.l)G.sel=j;
  else if(A.i===B.i){G.done[A.i]=G.nc++%6;G.n++;win(A.i);add(15);G.bank=Math.min(G.max,G.bank+1500);G.sel=null;
   if(Object.keys(G.done).length===G.k){G.bank=Math.min(G.max,G.bank+8000);push();r3();setTimeout(r3n,350);return}}
  else{miss(A.i);G.bank-=3000;G.bad=[G.sel,j];G.sel=null;setTimeout(()=>{G.bad=null;r3()},450)}}
 push();r3()}
/* ---- Multijoueur (code à 6 chiffres, façon Kahoot) ---- */
const QT=12000,NQ=10;let MP=null;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function mpQ(seed,qi,lv){const P=W.map((_,i)=>i).filter(i=>W[i].lv===lv),r=rng(seed);
 for(let k=P.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[P[k],P[j]]=[P[j],P[k]]}
 const i=P[qi%P.length],r2=rng(seed+qi*101+7),pool=P.filter(k=>k!==i&&W[k].g===W[i].g),d=[];
 while(d.length<3&&pool.length)d.push(pool.splice(Math.floor(r2()*pool.length),1)[0]);
 const o=[i,...d].map(k=>[r2(),k]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);return{i,o,fw:r2()<.6}}
function mp(){clearInterval(tm);playing=false;
 app.innerHTML=`<div class="screen"><h2>${t('mp')}</h2><p class="tip">${t('mpd')}</p>${room&&room.join?'':`<p class="tip">${t('mpoff')}</p>`}
<p class="tip">${t('mplvl')}</p><div class="pills">${LVS.map((l,i)=>SV.unl.includes(i)?`<button class="pill${SV.lv===i?' on':''}" onclick="SV.lv=${i};save();mp()">${l.n[LI]}</button>`:'').join('')}</div>
<button class="play" onclick="mpHost()">${t('mpc')}</button>
<input id="pin" inputmode="numeric" maxlength="6" placeholder="${t('pin')}"><button class="ghost" onclick="mpJoin()">${t('mpj')}</button><p class="tip" id="mpe"></p>
<button class="ghost" style="background:var(--card);color:var(--ink)" onclick="home()">${t('back')}</button></div>`}
function mpErr(m){const e=document.getElementById('mpe');if(e)e.textContent=m}
function mpHost(){mpEnter(String(100000+R(900000)),true)}
function mpJoin(){const v=(document.getElementById('pin').value||'').trim();if(!/^\d{6}$/.test(v)){mpErr(t('pinbad'));return}mpEnter(v,false)}
async function mpEnter(pin,host){
 if(!room||!room.join){mpErr(t('mpoff'));return}
 if(!pseudo){pseudo='Joueur'+(100+R(900));SV.n=pseudo;save()}
 let r;try{r=await room.join('g'+pin)}catch(e){mpErr(t('mpoff'));return}
 MP={r,pin,host,peers:[],h:{phase:'lobby',qi:-1,lv:SV.lv,seed:1+R(900000)},key:'',seen:host,me:{score:0,qa:-1,streak:0,last:0},paid:false,pick:-1};
 MP.un=r.onPeers(c=>{MP.peers=c.peers;mpSync()},()=>{});MP.peers=r.peers();
 await mpPush();
 if(host){mpSync()}else{mpMsg(t('mpsearch'));let n=0;MP.poll=setInterval(()=>{if(!MP)return;if(hostP()){clearInterval(MP.poll);mpSync()}else if(++n>12){clearInterval(MP.poll);mpQuit();mp();mpErr(t('mpnf'))}},400)}}
function mpPush(){if(!MP)return Promise.resolve();const p={name:pseudo,score:MP.me.score,qa:MP.me.qa};
 if(MP.host)Object.assign(p,{host:1,phase:MP.h.phase,qi:MP.h.qi,lv:MP.h.lv,seed:MP.h.seed,nq:NQ});
 return MP.r.presence(p).then(()=>{if(MP){MP.peers=MP.r.peers();mpLive()}}).catch(()=>{})}
function mpQuit(){if(!MP)return;clearInterval(MP.ti);clearInterval(MP.hl);clearInterval(MP.poll);try{MP.un&&MP.un()}catch(e){}try{MP.r.leave().catch(()=>{})}catch(e){}MP=null}
function mpMsg(m){app.innerHTML=`<div class="screen"><h2>${t('mp')}</h2><p>${m}</p><button class="ghost" onclick="mpQuit();home()">${t('leave')}</button></div>`}
function hostP(){if(!MP)return null;if(MP.host)return MP.h;const p=MP.peers.find(x=>x.kind==='viewer'&&x.presence&&x.presence.host);return p?p.presence:null}
function plist(){const L=MP.peers.filter(p=>p.kind==='viewer'&&p.presence&&p.presence.name).map(p=>{const me=p.isMe&&p.sameTab;return{n:String(p.presence.name).slice(0,14),s:me?MP.me.score:(+p.presence.score||0),qa:me?MP.me.qa:p.presence.qa,h:!!p.presence.host,me}});
 if(!L.some(x=>x.me))L.push({n:pseudo,s:MP.me.score,qa:MP.me.qa,h:MP.host,me:true});return L.sort((a,b)=>b.s-a.s)}
function mpSync(){if(!MP)return;const h=hostP();
 if(!h){if(MP.seen&&!MP.host){MP.seen=false;clearInterval(MP.ti);mpMsg(t('mphl'))}return}
 MP.seen=true;const k=h.phase+':'+h.qi;if(k!==MP.key){MP.key=k;mpScreen(h)}else mpLive()}
function mpScreen(h){clearInterval(MP.ti);
 if(h.phase==='lobby'){app.innerHTML=`<div class="screen"><h2>${t('mp')} · ${LVS[h.lv].n[LI]}</h2><p class="tip">${t('pinl')}</p><div class="big" style="letter-spacing:.15em">${MP.pin}</div>${qrHTML()}
${MP.host?`<button class="play" onclick="mpStart()">${t('mpgo')}</button>`:`<p class="tip">${t('mpwait')}</p>`}<div class="card lb" style="width:100%"><b>${t('players')}</b><div id="mpl"></div></div><button class="ghost" onclick="mpQuit();home()">${t('leave')}</button></div>`}
 else if(h.phase==='q'){const Q=mpQ(h.seed,h.qi,h.lv);MP.Q=Q;MP.pick=-1;MP.t0=Date.now();
  app.innerHTML=`<div class="hud"><span>${t('q').replace('{n}',h.qi+1).replace('{m}',h.nq||NQ)}</span><span id="mpa"></span><span id="mph"></span></div>${bar()}<div class="card"><div class="es">${esc(Q.fw?W[Q.i].es:W[Q.i].fr)}</div><div class="tip">${Q.fw?t('inFr'):t('inEs')}</div></div>
<div class="grid">${Q.o.map((k,j)=>`<button class="b${j}" data-k="${k}" onclick="mpAns(${k})">${esc(Q.fw?W[k].fr:W[k].es)}</button>`).join('')}</div><p class="tip" id="mpw"></p>`;
  MP.ti=setInterval(()=>{const l=1-(Date.now()-MP.t0)/QT,b=document.getElementById('bar');if(b)b.style.width=Math.max(0,l*100)+'%';if(l<=0){clearInterval(MP.ti);if(MP.pick===-1)mpAns(-1)}},100)}
 else if(h.phase==='r'){clearInterval(MP.ti);const Q=MP.Q||mpQ(h.seed,h.qi,h.lv);
  if(MP.me.qa!==h.qi){MP.pick=-2;MP.me.last=0;MP.me.streak=0;MP.me.qa=h.qi;MP.ok=false;mpPush()}
  app.innerHTML=`<div class="screen"><h2>${MP.ok?t('right'):t('wrong')}</h2><div class="big">+${MP.me.last}</div><div class="card" style="width:100%"><div class="es">${esc(W[Q.i].es)}</div><div class="tip">${esc(W[Q.i].fr)}</div></div>
<div class="card lb" style="width:100%"><b>${t('rank')}</b><div id="mpl"></div></div></div>`}
 else if(h.phase==='end'){
  if(!MP.paid){MP.paid=true;const ix=plist().findIndex(x=>x.me),tk=[20,12,8][ix]||4;SV.tok+=tk;SV.games++;SV.pts+=MP.me.score;SV.bp=Math.max(SV.bp||0,MP.me.score);chk();save();MP.tk=tk;MP.win=ix===0&&plist().length>1}
  app.innerHTML=`<div class="screen"><h2>${t('final')}</h2>${MP.win?`<div class="card lb" style="width:100%"><b>${t('mpwin')}</b></div>`:''}<div class="tk">+${MP.tk} ${t('earned')}</div>
<div class="card lb" style="width:100%"><div id="mpl"></div></div><button class="ghost" onclick="mpQuit();home()">${t('leave')}</button></div>`}
 mpLive()}
function mpAns(k){if(!MP||MP.pick!==-1)return;const h=hostP();if(!h||h.phase!=='q')return;clearInterval(MP.ti);MP.pick=k===-1?-2:k;
 const ok=k===MP.Q.i,left=Math.max(0,1-(Date.now()-MP.t0)/QT);
 MP.me.last=ok?500+Math.round(500*left)+Math.min(MP.me.streak,5)*40:0;MP.me.streak=ok?MP.me.streak+1:0;MP.me.score+=MP.me.last;MP.me.qa=h.qi;MP.ok=ok;
 if(!ok){const w=W[MP.Q.i].es;SV.err[w]=Math.min(5,(SV.err[w]||0)+1);save()}
 document.querySelectorAll('.grid button').forEach(b=>{b.disabled=true;if(+b.dataset.k===k)b.classList.add('sel')});
 const w=document.getElementById('mpw');if(w)w.textContent=t('sent');mpPush();mpLive()}
function mpLive(){if(!MP)return;const L=plist(),g=id=>document.getElementById(id),h=hostP();
 const rows=n=>L.slice(0,n).map((x,i)=>`<div class="row${x.me?' me':''}"><span>${i+1}</span><b>${esc(x.n)}${x.h?' ('+t('host')+')':''}${x.me?' '+t('you'):''}</b><em>${x.s}</em></div>`).join('');
 if(g('mpl'))g('mpl').innerHTML=MP.key.startsWith('lobby')?L.map(x=>`<div class="row"><span>•</span><b>${esc(x.n)}${x.h?' ('+t('host')+')':''}${x.me?' '+t('you'):''}</b><em></em></div>`).join(''):rows(MP.key.startsWith('end')?50:8);
 if(g('mpa')&&h)g('mpa').textContent=t('ans')+L.filter(x=>x.qa===h.qi).length+'/'+L.length;
 if(g('mph')){const i=L.findIndex(x=>x.me);g('mph').textContent=MP.me.score+(L.length>1?' #'+(i+1):'')}}
function mpStart(){if(!MP||!MP.host)return;MP.hl=setInterval(hostLoop,300);mpSet({phase:'q',qi:0,t0:Date.now()})}
function mpSet(p){Object.assign(MP.h,p);mpPush();mpSync()}
function hostLoop(){if(!MP||!MP.host)return;const h=MP.h,now=Date.now();
 if(h.phase==='q'){const L=plist();if(now-h.t0>QT+1200||(L.length&&L.every(x=>x.qa===h.qi)))mpSet({phase:'r',t0:now})}
 else if(h.phase==='r'&&now-h.t0>4500){if(h.qi+1>=NQ){clearInterval(MP.hl);mpSet({phase:'end'})}else mpSet({phase:'q',qi:h.qi+1,t0:now})}}
/* ---- Réseau multijoueur autonome (PeerJS / WebRTC) : l'hôte est le point central ---- */
const PPRoom={presence:()=>Promise.resolve(),peers:()=>[],onPeers:()=>()=>{},
join(name){return new Promise((resolve,reject)=>{
 if(!window.Peer){reject(new Error('nopeer'));return}
 const hubId='poppal-'+name;let P={},myId=null,isHub=false,conns=[],hs=[],peer=null,hub=null,done=false;const mine={};
 const view=()=>Object.keys(P).map(id=>({peer:id,by:null,isMe:id===myId,sameTab:id===myId,kind:'viewer',guest:false,presence:P[id],updatedAt:Date.now()}));
 const emit=()=>{const v=view();hs.forEach(h=>{try{h({peers:v,joined:[],left:[],updated:[]})}catch(e){}})};
 const bcast=()=>conns.forEach(c=>{try{if(c.open)c.send({t:'s',P})}catch(e){}});
 const room={name,presence(patch){Object.assign(mine,patch);P[myId]=Object.assign({},mine);
   if(isHub){bcast();emit()}else if(hub&&hub.open)hub.send({t:'p',patch});return Promise.resolve()},
  peers:view,onPeers(h){hs.push(h);return()=>{hs=hs.filter(x=>x!==h)}},connected:()=>true,
  leave(){hs=[];try{peer.destroy()}catch(e){}return Promise.resolve()}};
 const asClient=()=>{const p=new Peer();
  p.on('open',id=>{peer=p;myId=id;const c=p.connect(hubId,{reliable:true});hub=c;
   c.on('open',()=>{done=true;P={};P[id]=Object.assign({},mine);c.send({t:'p',patch:mine});resolve(room)});
   c.on('data',m=>{if(m&&m.t==='s'){P=m.P;emit()}});c.on('close',()=>{P={};emit()});c.on('error',()=>{})});
  p.on('error',e=>{if(!done){done=true;reject(e)}})};
 const p0=new Peer(hubId);
 p0.on('open',id=>{peer=p0;isHub=true;myId=id;P[id]={};done=true;resolve(room)});
 p0.on('connection',c=>{conns.push(c);
  c.on('open',()=>{P[c.peer]={};bcast();emit()});
  c.on('data',m=>{if(m&&m.t==='p'&&m.patch&&typeof m.patch==='object'){P[c.peer]=Object.assign(P[c.peer]||{},m.patch);bcast();emit()}});
  const gone=()=>{conns=conns.filter(x=>x!==c);delete P[c.peer];bcast();emit()};c.on('close',gone);c.on('error',gone)});
 p0.on('error',e=>{if(e&&e.type==='unavailable-id'){try{p0.destroy()}catch(x){}asClient()}else if(!done){done=true;reject(e)}});
 setTimeout(()=>{if(!done){done=true;reject(new Error('timeout'))}},10000)})}};
room=window.Peer?PPRoom:null;
applyTheme();home();
